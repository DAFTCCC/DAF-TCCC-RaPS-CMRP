name: Build FieldReady Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'android/**'
      - 'tools/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # setup-android v3 requested the retired Android SDK "tools" package.
      # Google stopped serving that package in September 2026, which caused
      # builds to fail before Gradle ever ran. v4 no longer requests it.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android 35 SDK components
        shell: bash
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate shared web source
        # .nojekyll is a GitHub Pages deployment marker and is intentionally NOT
        # required by the APK build. Hidden dotfiles can be skipped by browser uploads.
        run: python3 web/tests/static_validate.py

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          node --check web/app.js
          node --check web/skills.js
          node --check web/locations.js

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify Android assets match web source
        run: python3 tools/verify_sync.py

      - name: Stage APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FieldReady-Competency-Study-v4.1.4.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FieldReady-Competency-Study-v4.1.4-APK
          path: FieldReady-Competency-Study-v4.1.4.apk
          if-no-files-found: error
