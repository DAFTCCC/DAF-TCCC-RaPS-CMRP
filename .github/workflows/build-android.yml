name: Build FieldReady Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'android/**'
      - '.github/workflows/build-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate shared web source
        run: python web/tests/static_validate.py
      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify Android assets match web source
        run: python tools/verify_sync.py
      - name: Stage APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FieldReady-Competency-Study-v4.1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FieldReady-Competency-Study-v4.1.2-APK
          path: FieldReady-Competency-Study-v4.1.2.apk
          if-no-files-found: error
